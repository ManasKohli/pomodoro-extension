<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">

        <div class="modes">
            <button id="mode-work" class="mode-btn active">Pomodoro</button>
            <button id="mode-short-break" class="mode-btn">Short Break</button>
            <button id="mode-long-break" class="mode-btn">Long Break</button>
        </div>

        <h2>Pomodoro Timer</h2>
        <div id="timer">25:00</div>

        <div class="buttons">
            <button id="start">Start</button>
            <button id="pause">Pause</button>
            <button id="reset">Reset</button>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
